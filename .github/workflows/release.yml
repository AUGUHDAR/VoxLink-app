# VoxLink 应用端发布矩阵：两个版本（CLI / UI）× 三个平台。
#
# 为什么必须有 CI：CLI 版是纯 Go，本机就能交叉编译；UI 版基于 Wails，
# linux 需要 GCC+GTK/WebKitGTK、macOS 需要 Xcode 与系统 WKWebView，
# 在一台 Windows 机器上无法产出这两个平台的 UI 产物（实测交叉编译直接失败）。
#
# CLI 产物过 UPX（体积约为 UI 版的一半以下），UI 产物不压：
# UPX 会提高杀软/SmartScreen 误报率，只给"被启动器调用"的那一版用。

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则取 go 源码里的 appVersion 并以 tag 命名）
        required: false
        default: ''
      draft:
        description: 是否先建草稿
        type: boolean
        required: false
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- CLI 版：纯 Go，三平台三架构直接交叉编译，全部在 ubuntu runner 上产出 ----
          - name: cli-windows-amd64
            variant: cli
            os: ubuntu-latest
            goos: windows
            goarch: amd64
          - name: cli-linux-amd64
            variant: cli
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            native: true   # runner 就是 linux/amd64，压完能真跑一次
          - name: cli-linux-arm64
            variant: cli
            os: ubuntu-latest
            goos: linux
            goarch: arm64
          - name: cli-macos-arm64
            variant: cli
            os: macos-latest
            goos: darwin
            goarch: arm64
            native: true
          - name: cli-macos-amd64
            variant: cli
            os: macos-13
            goos: darwin
            goarch: amd64
            native: true
            # GitHub 正在淘汰 Intel macOS runner：这一格失败不拖红整条发布。
            continue-on-error: true
          # ---- UI 版：需要各平台的 CGO 工具链，只能在对应平台产 ----
          - name: ui-windows-amd64
            variant: ui
            os: windows-latest
            goos: windows
            goarch: amd64
            native: true
          - name: ui-linux-amd64
            variant: ui
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            native: true
          - name: ui-macos-arm64
            variant: ui
            os: macos-latest
            goos: darwin
            goarch: arm64
            native: true
          - name: ui-macos-amd64
            variant: ui
            os: macos-13
            goos: darwin
            goarch: amd64
            native: true
            # GitHub 正在淘汰 Intel macOS runner：这一格失败不拖红整条发布，
            # 由 Release 正文说明 Intel 版待补。
            continue-on-error: true

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Windows runner 的默认 shell 是 PowerShell：不设这一行，
                      # 构建步骤里的 `if [ ... ]` 会以 ParserError 直接挂掉
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 装 UI 版的系统依赖（Linux）
        if: matrix.variant == 'ui' && matrix.goos == 'linux'
        run: |
          sudo apt-get update
          # wails v2 的 linux 前端是 CGO 实现：缺任何一项都会以
          # "undefined: Frontend" 的形式炸掉（那是 cgo 文件被排除的症状，不是我们代码的问题）
          sudo apt-get install -y build-essential gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
          pkg-config --modversion webkit2gtk-4.1
          go env CC CGO_ENABLED

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Windows 的 wails 前端不需要 CGO（WebView2 走 COM）；在这里强开 CGO 会因为
          # runner 上没有 gcc 而直接失败。只有 linux/mac 的 UI 必须开。
          CGO_ENABLED: ${{ matrix.variant == 'ui' && matrix.goos != 'windows' && '1' || '0' }}
          # macOS 新 SDK 把 UTType 从 AppKit 挪进了 UniformTypeIdentifiers，wails 的 cgo
          # 声明没跟上 → 链接期 "Undefined symbols: _OBJC_CLASS_$_UTType"。补这一个 framework 就过。
          CGO_LDFLAGS: ${{ matrix.goos == 'darwin' && '-framework UniformTypeIdentifiers' || '' }}
        run: |
          go version
          # 后缀与 GUI 子系统标志都按"目标平台"判，不按 runner 判：
          # CLI 的 windows 产物是在 ubuntu runner 上交叉编译出来的，用 RUNNER_OS 判会
          # 产出一个没有 .exe 的 Windows 可执行文件（启动器和玩家都没法双击/识别）。
          EXT=""; GUIFLAG=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          if [ "${{ matrix.goos }}" = "windows" ] && [ "${{ matrix.variant }}" = "ui" ]; then
            GUIFLAG="-H windowsgui"   # CLI 反过来：它要留着控制台，启动器按 stdout 读事件
          fi
          OUT="dist/VoxLink-${{ matrix.variant == 'ui' && 'UI' || 'CLI' }}-${{ matrix.goos }}-${{ matrix.goarch }}$EXT"
          mkdir -p dist
          TAGS=cli
          if [ "${{ matrix.variant }}" = "ui" ]; then
            TAGS="desktop,production"
            # ubuntu-24.04 不再提供 webkit2gtk-4.0 的 dev 包，wails 靠这个标签切到 4.1
            if [ "${{ matrix.goos }}" = "linux" ]; then
              TAGS="$TAGS,webkit2_41"
            fi
          fi
          if [ "${{ matrix.variant }}" = "ui" ]; then
            go build -trimpath -tags "$TAGS" -ldflags "-s -w $GUIFLAG" -o "$OUT" .
          else
            go build -trimpath -tags "$TAGS" -ldflags "-s -w" -o "$OUT" .
          fi
          ls -la "$OUT"
          echo "ARTIFACT=$OUT" >> "$GITHUB_ENV"
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"

      - name: UPX 压缩（只压 CLI；mac 压不动就保留未压缩产物，不硬压）
        if: matrix.variant == 'cli'
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y upx-ucl ;;
            macOS) brew install upx ;;
          esac
          # UPX 4.2 对 Mach-O 直接 CantPackException: macOS is currently not supported；
          # --force-macos 出来的东西不可信，宁可发大一点的包，也不发一个可能跑不起来的包。
          if upx --best --lzma "$ARTIFACT"; then
            echo "UPX=已压缩（--best --lzma）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UPX 不适用该平台，重建一份未压缩的"
            go build -trimpath -tags cli -ldflags "-s -w" -o "$ARTIFACT" .  # CLI 一律不带 windowsgui
            echo "UPX=未压缩（UPX 不支持该平台/格式）" >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -la "$ARTIFACT"

      - name: 冒烟（CLI 版在所属平台上真跑一次：压坏了必须在这里暴露，而不是在玩家机器上）
        # UI 版不跑：它是窗口程序，runner 上没有显示器，而且 -H windowsgui 不写 stdout。
        # UI 的可用性由本机（Windows）实跑验证，见发布说明。
        if: matrix.variant == 'cli' && matrix.native == true
        run: |
          "./$ARTIFACT" describe --json > smoke.json
          test -s smoke.json
          grep -q '"commands"' smoke.json
          echo "SMOKE=通过（$RUNNER_OS / ${{ matrix.variant }}）" >> "$GITHUB_STEP_SUMMARY"

      - name: 打包（CLI 产物给 zip，UI 产物原样上传）
        run: |
          NAME=$(basename "$ARTIFACT")
          if [ "${{ matrix.variant }}" = "cli" ]; then
            zip -j "dist/${NAME}.zip" "$ARTIFACT" || true
          fi

      - name: 产物大小与口径进摘要
        run: |
          SIZE=$(wc -c < "$ARTIFACT")
          echo "| ${{ matrix.name }} | $SIZE 字节 | tags=$TAGS | ${{ matrix.variant }} |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: voxlink-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 汇总与校验和
        run: |
          mkdir -p out
          find artifacts -maxdepth 1 -type f -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt && ls -la

      - name: 建 Release（产物名自带版本/平台/架构，UPX 压缩项在正文标注）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: VoxLink 应用端 ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          draft: ${{ github.event.inputs.draft }}
          files: out/*
          body: |
            两个版本：`VoxLink-UI-*`（图形界面）、`VoxLink-CLI-*`（给启动器集成，无窗口）。
            CLI 版经 UPX 压缩，部分杀软可能误报，校验和见 SHA256SUMS.txt。

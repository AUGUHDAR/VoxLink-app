# 每次推送的最小验证：CLI 版（纯 Go）三平台交叉编译 + 单测。
#
# 刻意不在这里验 UI 版：UI 要 CGO + 各平台 GTK/WebKit/macOS SDK，
# 在 ubuntu runner 上"能不能编"取决于 runner 的 CGO 环境，与"代码对不对"混在一起看不清。
# UI 版的真实构建与验证放在 release.yml（每个平台用自己的 runner）。

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet（untagged 兜底入口）
        run: go vet .

      - name: go vet（-tags cli）
        run: go vet -tags cli .

      - name: 单测（untagged）
        run: go test -count=1 -timeout 240s .

      - name: 单测（-tags cli）
        run: go test -count=1 -timeout 240s -tags cli .

      - name: CLI 三平台交叉编译
        run: |
          for t in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -tags cli -ldflags "-s -w" -o /tmp/probe-$os-$arch .
            echo "  ok $os/$arch"
          done
